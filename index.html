<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Запись к психологу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: var(--tg-theme-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #222);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #fff);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
      box-sizing: border-box;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .option {
      background: var(--tg-theme-bg-color, #f0f2f5);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      text-align: left;
    }
    .option.active {
      border-color: var(--tg-theme-button-color, #2481cc);
    }
    button {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 10px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="avatar" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=300&q=80" alt="Фото">
    <h3 style="margin: 0 0 5px 0;">Анна Смирнова</h3>
    <p style="color: gray; font-size: 13px; margin: 0 0 15px 0;">Психолог-консультант</p>

    <div class="option active" onclick="selectItem(this, 'Онлайн-сессия (50 мин) - 3500 ₽')">
      <span>Онлайн-сессия</span>
      <b>3 500 ₽</b>
    </div>

    <div class="option" onclick="selectItem(this, 'Пакет из 4 сессий - 12000 ₽')">
      <span>Пакет 4 сессии</span>
      <b>12 000 ₽</b>
    </div>

    <button onclick="sendChoice()">Записаться</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let currentChoice = "Онлайн-сессия (50 мин) - 3500 ₽";

    function selectItem(el, text) {
      document.querySelectorAll('.option').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
      currentChoice = text;
    }

    function sendChoice() {
      tg.sendData(currentChoice);
    }
  </script>
</body>
</html>
