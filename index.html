<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>GlistCoin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at center top, #271c19, #09090b);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 16px 14px;
      overflow: hidden;
      touch-action: manipulation;
    }

    .header {
      text-align: center;
      margin-top: 2px;
    }
    .coin-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .score-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 4px 0 2px 0;
    }
    .score-val {
      font-size: 40px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
    }
    .auto-rate {
      font-size: 13px;
      color: #34d399;
      font-weight: 700;
    }

    /* 3D Кликер */
    .coin-wrapper {
      position: relative;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 230px;
      height: 230px;
      margin: auto 0;
    }
    .glist-coin {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: url('GlistCoin.png') no-repeat center center;
      background-size: cover;
      border: 5px solid #fbbf24;
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.4), inset 0 0 15px rgba(0,0,0,0.6);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.08s ease-out;
      touch-action: manipulation;
    }

    /* Вылетающие частицы */
    .pop-particle {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      font-size: 24px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
      animation: floatAndFade 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 100;
    }
    .mini-pic {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid #fbbf24;
      object-fit: cover;
    }
    @keyframes floatAndFade {
      0% { opacity: 1; transform: translate(0, 0) scale(0.9); }
      100% { opacity: 0; transform: translate(calc(-20px + 40px * var(--rx, 0.5)), -80px) scale(1.3); }
    }

    .bottom-section {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .energy-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #e4e4e7;
    }
    .energy-bar-bg {
      width: 100%;
      height: 10px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #3f3f46;
      margin-top: 3px;
    }
    .energy-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 999px;
      transition: width 0.15s ease;
    }

    .upgrades-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .boost-btn {
      background: rgba(39, 39, 42, 0.85);
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 8px 4px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .boost-btn:active { transform: scale(0.95); border-color: #fbbf24; }
    .boost-btn.disabled { opacity: 0.4; cursor: not-allowed; border-color: #27272a; }
    .boost-title { font-size: 11px; font-weight: 700; color: #e4e4e7; }
    .boost-lvl { font-size: 9px; color: #a1a1aa; }
    .boost-cost { font-size: 11px; font-weight: 800; color: #fbbf24; margin-top: 2px; }

    .save-action-btn {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      color: #18181b;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.5px;
      margin-top: 2px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
    }
    .save-action-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <div class="header">
    <div class="coin-badge">🐔 GLISTCOIN OFFICIAL</div>
    <div class="score-container">
      <span class="score-val" id="score">0</span>
    </div>
    <div class="auto-rate" id="autoRate">+0 / сек</div>
  </div>

  <div class="coin-wrapper" id="coinWrapper">
    <div class="glist-coin" id="coin"></div>
  </div>

  <div class="bottom-section">
    <div>
      <div class="energy-row">
        <span>⚡ Энергия</span>
        <span id="energyText">1000 / 1000</span>
      </div>
      <div class="energy-bar-bg">
        <div class="energy-bar-fill" id="energyFill"></div>
      </div>
    </div>

    <div class="upgrades-grid">
      <button type="button" class="boost-btn" id="btnMultitap" onclick="buyMultitap()">
        <span class="boost-title">👆 Мультитап</span>
        <span class="boost-lvl" id="lvlMultitap">Lvl 1</span>
        <span class="boost-cost" id="costMultitap">50 🪙</span>
      </button>

      <button type="button" class="boost-btn" id="btnEnergy" onclick="buyEnergyLimit()">
        <span class="boost-title">🔋 Энергия</span>
        <span class="boost-lvl" id="lvlEnergy">Lvl 1</span>
        <span class="boost-cost" id="costEnergy">100 🪙</span>
      </button>

      <button type="button" class="boost-btn" id="btnAuto" onclick="buyAutoBot()">
        <span class="boost-title">🤖 Автобот</span>
        <span class="boost-lvl" id="lvlAuto">Lvl 0</span>
        <span class="boost-cost" id="costAuto">200 🪙</span>
      </button>
    </div>

    <button type="button" class="save-action-btn" onclick="saveAndExit()">🏆 СОХРАНИТЬ В ТОП</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const serverScore = parseInt(urlParams.get('score')) || 0;
    const serverTap = parseInt(urlParams.get('tap')) || 1;
    const serverAuto = parseInt(urlParams.get('auto')) || 0;

    const localScore = parseInt(localStorage.getItem('gc_score')) || 0;
    const localTap = parseInt(localStorage.getItem('gc_tap')) || 1;
    const localAuto = parseInt(localStorage.getItem('gc_auto')) || 0;

    // ВСЕГДА берем максимальное значение, чтобы прогресс не затирался!
    let score = Math.max(serverScore, localScore);
    let tapPower = Math.max(serverTap, localTap);
    let autoPower = Math.max(serverAuto, localAuto);

    let maxEnergy = parseInt(localStorage.getItem('gc_max_energy')) || 1000;
    let energy = parseInt(localStorage.getItem('gc_cur_energy')) || maxEnergy;

    let costTap = Math.round(50 * Math.pow(1.8, tapPower - 1));
    let costEnergy = parseInt(localStorage.getItem('gc_cost_energy')) || 100;
    let costAuto = Math.round(200 * Math.pow(2.0, autoPower));

    const scoreEl = document.getElementById('score');
    const autoRateEl = document.getElementById('autoRate');
    const energyText = document.getElementById('energyText');
    const energyFill = document.getElementById('energyFill');
    const coinWrapper = document.getElementById('coinWrapper');
    const coin = document.getElementById('coin');

    function saveLocal() {
      localStorage.setItem('gc_score', score);
      localStorage.setItem('gc_tap', tapPower);
      localStorage.setItem('gc_auto', autoPower);
      localStorage.setItem('gc_max_energy', maxEnergy);
      localStorage.setItem('gc_cur_energy', Math.round(energy));
      localStorage.setItem('gc_cost_energy', costEnergy);
    }

    function updateUI() {
      scoreEl.innerText = score.toLocaleString('ru-RU');
      autoRateEl.innerText = `+${autoPower} / сек`;
      energyText.innerText = `${Math.round(energy)} / ${maxEnergy}`;
      energyFill.style.width = `${(energy / maxEnergy) * 100}%`;

      document.getElementById('lvlMultitap').innerText = `+${tapPower}`;
      document.getElementById('costMultitap').innerText = `${costTap.toLocaleString('ru-RU')} 🪙`;
      document.getElementById('btnMultitap').classList.toggle('disabled', score < costTap);

      document.getElementById('lvlEnergy').innerText = `${maxEnergy}`;
      document.getElementById('costEnergy').innerText = `${costEnergy.toLocaleString('ru-RU')} 🪙`;
      document.getElementById('btnEnergy').classList.toggle('disabled', score < costEnergy);

      document.getElementById('lvlAuto').innerText = `+${autoPower}/с`;
      document.getElementById('costAuto').innerText = `${costAuto.toLocaleString('ru-RU')} 🪙`;
      document.getElementById('btnAuto').classList.toggle('disabled', score < costAuto);
    }

    function handleTap(e) {
      if (energy < tapPower) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        return;
      }

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      score += tapPower;
      energy -= tapPower;

      const rect = coin.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      const touchX = clientX - rect.left;
      const touchY = clientY - rect.top;

      const tiltX = ((touchY - rect.height / 2) / (rect.height / 2)) * -16;
      const tiltY = ((touchX - rect.width / 2) / (rect.width / 2)) * 16;

      coin.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(0.96)`;
      setTimeout(() => {
        coin.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      }, 90);

      createParticle(touchX, touchY);
      updateUI();
      saveLocal();
    }

    function createParticle(x, y) {
      const particle = document.createElement('div');
      particle.className = 'pop-particle';
      particle.style.setProperty('--rx', Math.random());
      particle.style.left = `${x + 10}px`;
      particle.style.top = `${y - 10}px`;

      particle.innerHTML = `<img class="mini-pic" src="GlistCoin.png"><span>+${tapPower}</span>`;
      coinWrapper.appendChild(particle);

      setTimeout(() => particle.remove(), 700);
    }

    coin.addEventListener('pointerdown', handleTap);

    function buyMultitap() {
      if (score >= costTap) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        score -= costTap;
        tapPower += 1;
        costTap = Math.round(50 * Math.pow(1.8, tapPower - 1));
        updateUI();
        saveLocal();
      }
    }

    function buyEnergyLimit() {
      if (score >= costEnergy) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        score -= costEnergy;
        maxEnergy += 500;
        energy += 500;
        costEnergy = Math.round(costEnergy * 1.7);
        updateUI();
        saveLocal();
      }
    }

    function buyAutoBot() {
      if (score >= costAuto) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        score -= costAuto;
        autoPower += 1;
        costAuto = Math.round(200 * Math.pow(2.0, autoPower));
        updateUI();
        saveLocal();
      }
    }

    setInterval(() => {
      if (autoPower > 0) {
        score += autoPower;
        updateUI();
        saveLocal();
      }
    }, 1000);

    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + 4);
        updateUI();
      }
    }, 500);

    function saveAndExit() {
      saveLocal();
      const payload = {
        action: "sync",
        score: score,
        tap_power: tapPower,
        auto_power: autoPower
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert("Сохранено: " + score);
      }
    }

    updateUI();
    saveLocal();
  </script>
</body>
</html>
