<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>GlistCoin: Mega Boss Clicker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at center, #45220a, #1a0c03, #09090b);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 14px 10px;
      overflow: hidden;
      touch-action: manipulation;
      position: relative;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 390px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 6px 12px;
      border-radius: 14px;
      backdrop-filter: blur(4px);
    }
    .score-badge {
      font-size: 19px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dps-badge {
      font-size: 11px;
      font-weight: 800;
      color: #34d399;
      background: rgba(52, 211, 153, 0.15);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .sound-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
    }

    /* Арена с боссом */
    .boss-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 390px;
      margin: 2px 0;
      position: relative;
    }
    .boss-title-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
      margin-bottom: 3px;
      font-size: 13px;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Индикатор режима Берсерка x20 */
    .buff-indicator {
      display: none;
      font-size: 11px;
      font-weight: 900;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      border-radius: 20px;
      padding: 2px 8px;
      margin-bottom: 3px;
      animation: pulseBuff 0.5s infinite alternate;
    }
    @keyframes pulseBuff {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 10px #ef4444; }
    }

    /* Полоска здоровья HP */
    .hp-container {
      width: 100%;
      height: 18px;
      background: #1c1917;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid #b91c1c;
      position: relative;
      margin-bottom: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #dc2626, #f87171);
      border-radius: 999px;
      transition: width 0.1s ease;
    }
    .hp-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      line-height: 14px;
      font-size: 11px;
      font-weight: 900;
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    /* Плавающий босс */
    .boss-wrapper {
      position: relative;
      perspective: 1000px;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: floatIdle 3.2s ease-in-out infinite;
    }
    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }

    .boss-avatar {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      touch-action: manipulation;
    }
    .boss-avatar.photo-mode {
      background: url('GlistCoin.png') no-repeat center center;
      background-size: cover;
      border: 5px solid #fbbf24;
      box-shadow: 0 0 40px rgba(251, 191, 36, 0.85);
    }
    .boss-avatar svg {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Летающий бонусный меч (Spawn) */
    .flying-sword {
      position: absolute;
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #f59e0b, #78350f);
      border: 2px solid #fef08a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      z-index: 200;
      box-shadow: 0 0 20px #fbbf24;
      animation: floatSword 4.5s linear forwards;
    }
    @keyframes floatSword {
      0% { opacity: 0; transform: translate(var(--startX), var(--startY)) scale(0.5) rotate(0deg); }
      15% { opacity: 1; transform: translate(var(--midX1), var(--midY1)) scale(1.1) rotate(120deg); }
      85% { opacity: 1; transform: translate(var(--midX2), var(--midY2)) scale(1) rotate(240deg); }
      100% { opacity: 0; transform: translate(var(--endX), var(--endY)) scale(0.4) rotate(360deg); }
    }

    /* Вылетающий урон */
    .dmg-text {
      position: absolute;
      font-size: 22px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
      pointer-events: none;
      animation: popUp 0.6s ease-out forwards;
      z-index: 100;
    }
    .dmg-text.crit {
      font-size: 28px;
      color: #ef4444;
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
    }
    .dmg-text.frenzy {
      font-size: 32px;
      color: #e11d48;
      text-shadow: 0 0 16px #fda4af;
    }
    @keyframes popUp {
      0% { opacity: 1; transform: translateY(0) scale(0.9); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
    }

    /* Магазин предметов */
    .shop-section {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 180px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .item-card {
      background: rgba(41, 26, 15, 0.85);
      border: 1px solid #78350f;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-card.locked {
      opacity: 0.35;
      background: rgba(20, 10, 5, 0.6);
      border-style: dashed;
    }
    .item-card.bought {
      border-color: #059669;
      background: rgba(6, 78, 59, 0.4);
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-icon-box {
      font-size: 19px;
      width: 30px;
      height: 30px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .item-info-name { font-size: 12px; font-weight: 800; color: #fef08a; }
    .item-info-desc { font-size: 10px; color: #d6d3d1; }
    
    .buy-btn {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      color: #18181b;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .buy-btn.disabled {
      background: #44403c;
      color: #78716c;
      cursor: not-allowed;
    }

    /* Кнопка сохранения */
    .save-action-btn {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(90deg, #eab308, #ca8a04);
      color: #1c1917;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(234, 179, 8, 0.3);
      margin-top: 4px;
    }
    .save-action-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <!-- Верхняя строка -->
  <div class="top-bar">
    <div class="score-badge">🪙 <span id="score">0</span></div>
    <div class="top-controls">
      <div class="dps-badge" id="dpsText">+0/с (Тап: 1)</div>
      <button type="button" class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    </div>
  </div>

  <!-- Арена Босса -->
  <div class="boss-arena">
    <div class="buff-indicator" id="buffIndicator">🔥 БЕРСЕРК: УРОН x20 (5с)</div>
    <div class="boss-title-row">
      <span id="bossName">Босс 1: 99 Сынини (Пицца)</span>
      <span id="stageNum">Этап 1/10</span>
    </div>
    
    <div class="hp-container">
      <div class="hp-bar" id="hpBar"></div>
      <div class="hp-text" id="hpText">5 000 / 5 000 HP</div>
    </div>

    <div class="boss-wrapper" id="bossWrapper">
      <div class="boss-avatar" id="bossAvatar"></div>
    </div>
  </div>

  <!-- Магазин сокрытых артефактов -->
  <div class="shop-section" id="shopList"></div>

  <!-- Кнопка записи в топ -->
  <button type="button" class="save-action-btn" onclick="saveAndExit()">🏆 СОХРАНИТЬ В ТОП</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ================= ЗВУКОВОЙ ДВИЖОК =================
    let audioCtx = null;
    let isSoundOn = localStorage.getItem('gb_sound') !== 'false';

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      localStorage.setItem('gb_sound', isSoundOn);
      document.getElementById('soundBtn').innerText = isSoundOn ? '🔊' : '🔇';
    }

    function playTone(freq, duration, type='sine', gainVal=0.3) {
      if (!isSoundOn) return;
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 0.2), audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playTapSound() { playTone(420, 0.05, 'triangle', 0.25); }
    function playCritSound() { playTone(880, 0.12, 'sine', 0.45); }
    function playSwordSound() {
      if (!isSoundOn) return;
      initAudio();
      playTone(1200, 0.25, 'sawtooth', 0.4);
    }

    // Форматирование чисел: 1.5k, 2.4M, 10B
    function formatNum(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(2).replace(/\.00$/, '') + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(2).replace(/\.00$/, '') + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
      return Math.round(num).toString();
    }

    // ================= 10 БОССОВ =================
    const SVG_PIZZA = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#f59e0b" stroke="#78350f" stroke-width="4"/><circle cx="50" cy="50" r="40" fill="#fbbf24"/><circle cx="30" cy="30" r="7" fill="#dc2626"/><circle cx="70" cy="32" r="6" fill="#dc2626"/><circle cx="48" cy="74" r="7" fill="#dc2626"/><ellipse cx="32" cy="44" rx="9" ry="12" fill="#fff"/><circle cx="34" cy="44" r="5" fill="#991b1b"/><ellipse cx="68" cy="44" rx="9" ry="12" fill="#fff"/><circle cx="66" cy="44" r="5" fill="#991b1b"/><path d="M24 58 Q50 90 76 58 Z" fill="#450a0a" stroke="#1c1917" stroke-width="2"/><polygon points="30,60 35,74 40,60 45,74 50,60 55,74 60,60 65,74 70,60" fill="#fff"/></svg>`;
    const SVG_CHICKEN = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#facc15" stroke="#ca8a04" stroke-width="4"/><path d="M50 8 C40 2, 35 18, 50 18 C65 18, 60 2, 50 8" fill="#ef4444"/><circle cx="34" cy="40" r="10" fill="#fff"/><circle cx="34" cy="40" r="5" fill="#000"/><circle cx="66" cy="40" r="10" fill="#fff"/><circle cx="66" cy="40" r="5" fill="#000"/><polygon points="50,46 38,62 62,62" fill="#ea580c"/><path d="M30 68 Q50 86 70 68" stroke="#1c1917" stroke-width="3" fill="#fff"/><path d="M34 68 L37 76 L42 68 L47 76 L52 68 L57 76 L62 68 L66 76" stroke="#1c1917" stroke-width="2" fill="none"/></svg>`;
    const SVG_SHAURMA = `<svg viewBox="0 0 100 100"><rect x="25" y="15" width="50" height="70" rx="20" fill="#d97706" stroke="#78350f" stroke-width="4"/><circle cx="40" cy="38" r="6" fill="#ef4444"/><circle cx="60" cy="38" r="6" fill="#ef4444"/><path d="M35 58 Q50 72 65 58" stroke="#fff" stroke-width="4" fill="none"/><circle cx="50" cy="22" r="4" fill="#22c55e"/><circle cx="42" cy="74" r="5" fill="#22c55e"/></svg>`;
    const SVG_CYBORG = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#3f3f46" stroke="#18181b" stroke-width="4"/><rect x="20" y="34" width="60" height="18" rx="6" fill="#18181b"/><line x1="24" y1="43" x2="76" y2="43" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="43" r="6" fill="#fef08a"/><rect x="30" y="64" width="40" height="14" rx="3" fill="#71717a"/><line x1="38" y1="64" x2="38" y2="78" stroke="#18181b" stroke-width="2"/><line x1="50" y1="64" x2="50" y2="78" stroke="#18181b" stroke-width="2"/><line x1="62" y1="64" x2="62" y2="78" stroke="#18181b" stroke-width="2"/></svg>`;
    const SVG_PELMEN = `<svg viewBox="0 0 100 100"><path d="M15 65 C15 30, 85 30, 85 65 C85 85, 15 85, 15 65 Z" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="4"/><circle cx="38" cy="52" r="5" fill="#dc2626"/><circle cx="62" cy="52" r="5" fill="#dc2626"/><path d="M40 68 Q50 56 60 68" stroke="#09090b" stroke-width="3" fill="none"/></svg>`;
    const SVG_GLADIATOR = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#ca8a04" stroke="#713f12" stroke-width="4"/><rect x="25" y="30" width="50" height="24" rx="4" fill="#451a03"/><circle cx="40" cy="42" r="4" fill="#ef4444"/><circle cx="60" cy="42" r="4" fill="#ef4444"/><path d="M40 70 L50 60 L60 70" stroke="#fef08a" stroke-width="4" fill="none"/></svg>`;

    const SVG_TEAPOT = `<svg viewBox="0 0 100 100"><circle cx="50" cy="54" r="36" fill="#0284c7" stroke="#075985" stroke-width="4"/><ellipse cx="50" cy="24" rx="20" ry="6" fill="#38bdf8"/><circle cx="40" cy="50" r="5" fill="#fef08a"/><circle cx="60" cy="50" r="5" fill="#fef08a"/><path d="M38 68 Q50 78 62 68" stroke="#fff" stroke-width="3" fill="none"/></svg>`;
    const SVG_COSMIC = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#581c87" stroke="#c084fc" stroke-width="4"/><circle cx="50" cy="50" r="30" fill="#9333ea"/><circle cx="36" cy="45" r="7" fill="#38bdf8"/><circle cx="64" cy="45" r="7" fill="#38bdf8"/><path d="M34 66 Q50 82 66 66" stroke="#f472b6" stroke-width="4" fill="none"/></svg>`;

    const BOSSES = [
      { name: "1. 99 Сынини (Пицца)", hp: 5000, reward: 2000, type: "svg", svg: SVG_PIZZA },
      { name: "2. Бешеный Цыпа", hp: 25000, reward: 10000, type: "svg", svg: SVG_CHICKEN },
      { name: "3. Доктор Шаурма", hp: 100000, reward: 45000, type: "svg", svg: SVG_SHAURMA },
      { name: "4. Кибер-Глист 3000", hp: 450000, reward: 200000, type: "svg", svg: SVG_CYBORG },
      { name: "5. Пельмень Ярости", hp: 1800000, reward: 800000, type: "svg", svg: SVG_PELMEN },
      { name: "6. Золотой Петух-Гладиатор", hp: 7500000, reward: 3500000, type: "svg", svg: SVG_GLADIATOR },
      { name: "7. Демонический Бургер", hp: 30000000, reward: 15000000, type: "svg", svg: SVG_BURGER },
      { name: "8. Ядерный Чайник", hp: 120000000, reward: 60000000, type: "svg", svg: SVG_TEAPOT },
      { name: "9. Космический Овипрайм", hp: 500000000, reward: 250000000, type: "svg", svg: SVG_COSMIC },
      { name: "10. ФИНАЛ: Властелин Шумовки 👑", hp: 2000000000, reward: 1000000000, type: "photo" }
    ];

    // ================= 10 АРТЕФАКТОВ В МАГАЗИНЕ =================
    const ITEMS = [
      { id: 0, name: "Деревянная ложка", icon: "🥄", cost: 100, tap: 4, auto: 1, desc: "+4 клик, +1/сек" },
      { id: 1, name: "Стальная шумовка", icon: "🍳", cost: 800, tap: 20, auto: 8, desc: "+20 клик, +8/сек" },
      { id: 2, name: "Электро-венчик", icon: "⚡", cost: 4500, tap: 90, auto: 35, desc: "+90 клик, +35/сек" },
      { id: 3, name: "Броня из фольги", icon: "🛡️", cost: 25000, tap: 400, auto: 180, desc: "+400 клик, +180/сек" },
      { id: 4, name: "Золотой капюшон", icon: "👑", cost: 120000, tap: 1800, auto: 850, desc: "+1.8k клик, +850/с" },
      { id: 5, name: "Плазменная тёрка", icon: "🔮", cost: 600000, tap: 8000, auto: 4000, desc: "+8k клик, +4k/с" },
      { id: 6, name: "Кибер-Курятник", icon: "🤖", cost: 3000000, tap: 35000, auto: 18000, desc: "+35k клик, +18k/с" },
      { id: 7, name: "Ядерный фартук", icon: "☢️", cost: 15000000, tap: 160000, auto: 80000, desc: "+160k клик, +80k/с" },
      { id: 8, name: "Антиматерия-Сковорода", icon: "🌌", cost: 80000000, tap: 750000, auto: 400000, desc: "+750k клик, +400k/с" },
      { id: 9, name: "Перчатка Всевластия", icon: "💎", cost: 400000000, tap: 3500000, auto: 2000000, desc: "+3.5M клик, +2M/с" }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const serverScore = parseInt(urlParams.get('score')) || 0;
    const serverTap = parseInt(urlParams.get('tap')) || 1;
    const serverAuto = parseInt(urlParams.get('auto')) || 0;

    let score = Math.max(serverScore, parseInt(localStorage.getItem('gb_score')) || 0);
    let tapPower = Math.max(serverTap, parseInt(localStorage.getItem('gb_tap')) || 1);
    let autoPower = Math.max(serverAuto, parseInt(localStorage.getItem('gb_auto')) || 0);

    let currentBossIdx = parseInt(localStorage.getItem('gb_boss_idx')) || 0;
    let currentHp = parseInt(localStorage.getItem('gb_boss_hp')) || BOSSES[currentBossIdx].hp;
    let unlockedItemId = parseInt(localStorage.getItem('gb_unlocked_item')) || 0;

    // Берсерк бафф
    let frenzyMultiplier = 1;
    let frenzyTimer = null;

    const scoreEl = document.getElementById('score');
    const dpsText = document.getElementById('dpsText');
    const bossNameEl = document.getElementById('bossName');
    const stageNumEl = document.getElementById('stageNum');
    const hpBar = document.getElementById('hpBar');
    const hpText = document.getElementById('hpText');
    const bossAvatar = document.getElementById('bossAvatar');
    const bossWrapper = document.getElementById('bossWrapper');
    const shopList = document.getElementById('shopList');
    const buffIndicator = document.getElementById('buffIndicator');

    function saveLocal() {
      localStorage.setItem('gb_score', score);
      localStorage.setItem('gb_tap', tapPower);
      localStorage.setItem('gb_auto', autoPower);
      localStorage.setItem('gb_boss_idx', currentBossIdx);
      localStorage.setItem('gb_boss_hp', currentHp);
      localStorage.setItem('gb_unlocked_item', unlockedItemId);
    }

    function updateBossUI() {
      const boss = BOSSES[currentBossIdx];
      bossNameEl.innerText = boss.name;
      stageNumEl.innerText = `Этап ${currentBossIdx + 1}/${BOSSES.length}`;

      if (boss.type === "photo") {
        bossAvatar.innerHTML = "";
        bossAvatar.classList.add("photo-mode");
      } else {
        bossAvatar.classList.remove("photo-mode");
        bossAvatar.innerHTML = boss.svg;
      }

      const pct = Math.max(0, (currentHp / boss.hp) * 100);
      hpBar.style.width = `${pct}%`;
      hpText.innerText = `${formatNum(currentHp)} / ${formatNum(boss.hp)} HP`;
    }

    function renderShop() {
      shopList.innerHTML = '';
      ITEMS.forEach((item, idx) => {
        const isBought = idx < unlockedItemId;
        const isCurrent = idx === unlockedItemId;
        const isLocked = idx > unlockedItemId;

        const card = document.createElement('div');
        card.className = `item-card ${isBought ? 'bought' : ''} ${isLocked ? 'locked' : ''}`;

        if (isLocked) {
          card.innerHTML = `
            <div class="item-left">
              <div class="item-icon-box">❓</div>
              <div>
                <div class="item-info-name">Неизвестный артефакт</div>
                <div class="item-info-desc">Заблокировано</div>
              </div>
            </div>
            <button class="buy-btn disabled">???</button>
          `;
        } else if (isBought) {
          card.innerHTML = `
            <div class="item-left">
              <div class="item-icon-box">${item.icon}</div>
              <div>
                <div class="item-info-name">${item.name}</div>
                <div class="item-info-desc">Активно (${item.desc})</div>
              </div>
            </div>
            <button class="buy-btn" style="background:#059669;color:#fff;">Куплено ✔</button>
          `;
        } else {
          card.innerHTML = `
            <div class="item-left">
              <div class="item-icon-box">${item.icon}</div>
              <div>
                <div class="item-info-name">${item.name}</div>
                <div class="item-info-desc">${item.desc}</div>
              </div>
            </div>
            <button class="buy-btn ${score < item.cost ? 'disabled' : ''}" onclick="buyItem(${idx})">
              ${formatNum(item.cost)} 🪙
            </button>
          `;
        }
        shopList.appendChild(card);
      });
    }

    function updateUI() {
      scoreEl.innerText = formatNum(score);
      dpsText.innerText = `+${formatNum(autoPower)}/с (Тап: ${formatNum(tapPower * frenzyMultiplier)})`;
      updateBossUI();
      renderShop();
    }

    // ================= СПАВН ЛЕТАЮЩЕГО МЕЧА (x20 УРОН) =================
    function spawnFlyingSword() {
      const sword = document.createElement('div');
      sword.className = 'flying-sword';
      sword.innerHTML = '⚔️';

      // Случайная траектория полета
      const startX = Math.random() < 0.5 ? -60 : 340;
      const endX = startX < 0 ? 350 : -60;
      const startY = 40 + Math.random() * 200;
      const endY = 40 + Math.random() * 200;

      sword.style.setProperty('--startX', `${startX}px`);
      sword.style.setProperty('--startY', `${startY}px`);
      sword.style.setProperty('--midX1', `${(startX + endX) / 2 + (Math.random() * 80 - 40)}px`);
      sword.style.setProperty('--midY1', `${(startY + endY) / 2 - 60}px`);
      sword.style.setProperty('--midX2', `${(startX + endX) / 2 + (Math.random() * 80 - 40)}px`);
      sword.style.setProperty('--midY2', `${(startY + endY) / 2 + 60}px`);
      sword.style.setProperty('--endX', `${endX}px`);
      sword.style.setProperty('--endY', `${endY}px`);

      sword.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        playSwordSound();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

        // Включаем x20 БЕРСЕРК
        frenzyMultiplier = 20;
        buffIndicator.style.display = 'block';
        let timeLeft = 6;
        buffIndicator.innerText = `🔥 БЕРСЕРК: УРОН x20 (${timeLeft}с)`;

        clearInterval(frenzyTimer);
        frenzyTimer = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(frenzyTimer);
            frenzyMultiplier = 1;
            buffIndicator.style.display = 'none';
            updateUI();
          } else {
            buffIndicator.innerText = `🔥 БЕРСЕРК: УРОН x20 (${timeLeft}с)`;
          }
        }, 1000);

        sword.remove();
        updateUI();
      });

      document.body.appendChild(sword);
      setTimeout(() => { if (sword.parentNode) sword.remove(); }, 4500);
    }

    // Спавн мечей каждые 6-10 секунд
    setInterval(() => {
      if (Math.random() < 0.8) spawnFlyingSword();
    }, 7000);

    // ================= ТАП ПО БОССУ =================
    function handleTap(e) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      const isCrit = Math.random() < 0.08;
      let damage = (isCrit ? tapPower * 5 : tapPower) * frenzyMultiplier;

      if (frenzyMultiplier > 1) playCritSound();
      else if (isCrit) playCritSound();
      else playTapSound();

      score += damage;
      currentHp = Math.max(0, currentHp - damage);

      // 3D-наклон
      const rect = bossAvatar.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX) || rect.left + 80;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY) || rect.top + 60;
      const touchX = clientX - rect.left;
      const touchY = clientY - rect.top;

      const tiltX = ((touchY - rect.height / 2) / (rect.height / 2)) * -18;
      const tiltY = ((touchX - rect.width / 2) / (rect.width / 2)) * 18;

      bossAvatar.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(0.94)`;
      setTimeout(() => { bossAvatar.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)'; }, 90);

      showDamage(damage, isCrit, touchX, touchY);

      if (currentHp <= 0) onBossDefeated();

      updateUI();
      saveLocal();
    }

    function showDamage(dmg, isCrit, x, y) {
      const tag = document.createElement('div');
      tag.className = `dmg-text ${frenzyMultiplier > 1 ? 'frenzy' : (isCrit ? 'crit' : '')}`;
      tag.innerText = frenzyMultiplier > 1 ? `x20! +${formatNum(dmg)}` : (isCrit ? `CRIT! +${formatNum(dmg)}` : `+${formatNum(dmg)}`);
      tag.style.left = `${x + 10}px`;
      tag.style.top = `${y - 15}px`;

      bossWrapper.appendChild(tag);
      setTimeout(() => tag.remove(), 600);
    }

    function onBossDefeated() {
      const reward = BOSSES[currentBossIdx].reward;
      score += reward;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      if (currentBossIdx < BOSSES.length - 1) {
        currentBossIdx++;
      }
      currentHp = BOSSES[currentBossIdx].hp;
    }

    function buyItem(idx) {
      const item = ITEMS[idx];
      if (score >= item.cost && idx === unlockedItemId) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        score -= item.cost;
        tapPower += item.tap;
        autoPower += item.auto;
        unlockedItemId++;
        updateUI();
        saveLocal();
      }
    }

    bossAvatar.addEventListener('pointerdown', handleTap);

    // Пассивный авто-доход
    setInterval(() => {
      if (autoPower > 0) {
        score += autoPower;
        currentHp = Math.max(0, currentHp - autoPower);
        if (currentHp <= 0) onBossDefeated();
        updateUI();
        saveLocal();
      }
    }, 1000);

    function saveAndExit() {
      saveLocal();
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "sync",
          score: score,
          tap_power: tapPower,
          auto_power: autoPower
        }));
        tg.close();
      }
    }

    document.getElementById('soundBtn').innerText = isSoundOn ? '🔊' : '🔇';
    updateUI();
  </script>
</body>
</html>
