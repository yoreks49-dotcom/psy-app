<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>GlistCoin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at center top, #1c1917, #09090b);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Верхняя панель */
    .header {
      text-align: center;
      margin-top: 6px;
    }
    .coin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .score-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 2px 0;
    }
    .score-icon {
      font-size: 34px;
    }
    .score-val {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-shadow: 0 0 24px rgba(251, 191, 36, 0.4);
    }
    .auto-rate {
      font-size: 12px;
      color: #34d399;
      font-weight: 600;
    }

    /* Круглый кликер с 3D перспективой */
    .coin-wrapper {
      position: relative;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 250px;
      height: 250px;
      margin: auto 0;
    }
    .glist-coin {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 6px solid #fbbf24;
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.45), inset 0 0 15px rgba(0,0,0,0.6);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.1s ease;
      touch-action: manipulation;
    }
    .glist-coin:active {
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.7);
    }

    /* Вылетающие частицы (фотка + цифра) */
    .pop-particle {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      font-size: 24px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
      animation: floatAndFade 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 100;
    }
    .mini-pic {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fbbf24;
      object-fit: cover;
    }
    @keyframes floatAndFade {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.9) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-20px + 40px * var(--rx, 0.5)), -90px) scale(1.4) rotate(calc(-20deg + 40deg * var(--rx, 0.5)));
      }
    }

    /* Нижний блок: Энергия */
    .bottom-section {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .energy-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #d4d4d8;
    }
    .energy-bar-bg {
      width: 100%;
      height: 12px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #3f3f46;
      margin-top: 4px;
    }
    .energy-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 999px;
      transition: width 0.15s ease;
    }

    /* Кнопки прокачки (Бусты) */
    .upgrades-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .boost-btn {
      background: rgba(39, 39, 42, 0.8);
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 8px 4px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .boost-btn:active {
      transform: scale(0.95);
      border-color: #fbbf24;
    }
    .boost-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #27272a;
    }
    .boost-title {
      font-size: 11px;
      font-weight: 700;
      color: #e4e4e7;
    }
    .boost-lvl {
      font-size: 9px;
      color: #a1a1aa;
    }
    .boost-cost {
      font-size: 11px;
      font-weight: 800;
      color: #fbbf24;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="coin-badge">🔥 GlistCoin Official</div>
    <div class="score-container">
      <span class="score-icon">🪙</span>
      <span class="score-val" id="score">0</span>
    </div>
    <div class="auto-rate" id="autoRate">+0 / сек</div>
  </div>

  <!-- Кликер с 3D-наклоном -->
  <div class="coin-wrapper" id="coinWrapper">
    <div class="glist-coin" id="coin"></div>
  </div>

  <!-- Нижняя панель с энергией и бустами -->
  <div class="bottom-section">
    <div>
      <div class="energy-row">
        <span>⚡ Энергия</span>
        <span id="energyText">1000 / 1000</span>
      </div>
      <div class="energy-bar-bg">
        <div class="energy-bar-fill" id="energyFill"></div>
      </div>
    </div>

    <div class="upgrades-grid">
      <button type="button" class="boost-btn" id="btnMultitap" onclick="buyMultitap()">
        <span class="boost-title">👆 Мультитап</span>
        <span class="boost-lvl" id="lvlMultitap">Lvl 1</span>
        <span class="boost-cost" id="costMultitap">50 🪙</span>
      </button>

      <button type="button" class="boost-btn" id="btnEnergy" onclick="buyEnergyLimit()">
        <span class="boost-title">🔋 Энергия</span>
        <span class="boost-lvl" id="lvlEnergy">Lvl 1</span>
        <span class="boost-cost" id="costEnergy">100 🪙</span>
      </button>

      <button type="button" class="boost-btn" id="btnAuto" onclick="buyAutoBot()">
        <span class="boost-title">🤖 Автобот</span>
        <span class="boost-lvl" id="lvlAuto">Lvl 0</span>
        <span class="boost-cost" id="costAuto">200 🪙</span>
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Твоя картинка GlistCoin (загружена как аватарка коина)
    const COIN_IMG_URL = "https://images.weserv.nl/?url=https://i.ibb.co/6R2nQ6w/glist.png&default=https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg";
    
    // Подставляем картинку на коин
    const coin = document.getElementById('coin');
    coin.style.backgroundImage = `url('https://picsum.photos/400')`; // Резерв
    
    // Состояние игры (сохраняется в localStorage)
    let score = parseInt(localStorage.getItem('gc_score')) || 0;
    let tapPower = parseInt(localStorage.getItem('gc_tap')) || 1;
    let autoPower = parseInt(localStorage.getItem('gc_auto')) || 0;
    let maxEnergy = parseInt(localStorage.getItem('gc_max_energy')) || 1000;
    let energy = parseInt(localStorage.getItem('gc_cur_energy')) || maxEnergy;

    let costTap = parseInt(localStorage.getItem('gc_cost_tap')) || 50;
    let costEnergy = parseInt(localStorage.getItem('gc_cost_energy')) || 100;
    let costAuto = parseInt(localStorage.getItem('gc_cost_auto')) || 200;

    const scoreEl = document.getElementById('score');
    const autoRateEl = document.getElementById('autoRate');
    const energyText = document.getElementById('energyText');
    const energyFill = document.getElementById('energyFill');
    const coinWrapper = document.getElementById('coinWrapper');

    function saveState() {
      localStorage.setItem('gc_score', score);
      localStorage.setItem('gc_tap', tapPower);
      localStorage.setItem('gc_auto', autoPower);
      localStorage.setItem('gc_max_energy', maxEnergy);
      localStorage.setItem('gc_cur_energy', Math.round(energy));
      localStorage.setItem('gc_cost_tap', costTap);
      localStorage.setItem('gc_cost_energy', costEnergy);
      localStorage.setItem('gc_cost_auto', costAuto);
    }

    function updateUI() {
      scoreEl.innerText = score.toLocaleString('ru-RU');
      autoRateEl.innerText = `+${autoPower} / сек`;
      energyText.innerText = `${Math.round(energy)} / ${maxEnergy}`;
      energyFill.style.width = `${(energy / maxEnergy) * 100}%`;

      document.getElementById('lvlMultitap').innerText = `+${tapPower}`;
      document.getElementById('costMultitap').innerText = `${costTap.toLocaleString('ru-RU')} 🪙`;
      document.getElementById('btnMultitap').classList.toggle('disabled', score < costTap);

      document.getElementById('lvlEnergy').innerText = `${maxEnergy}`;
      document.getElementById('costEnergy').innerText = `${costEnergy.toLocaleString('ru-RU')} 🪙`;
      document.getElementById('btnEnergy').classList.toggle('disabled', score < costEnergy);

      document.getElementById('lvlAuto').innerText = `+${autoPower}/с`;
      document.getElementById('costAuto').innerText = `${costAuto.toLocaleString('ru-RU')} 🪙`;
      document.getElementById('btnAuto').classList.toggle('disabled', score < costAuto);
    }

    // 3D-наклон при тапе
    function handleTap(e) {
      if (energy < tapPower) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        return;
      }

      // Виброотклик iPhone
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      score += tapPower;
      energy -= tapPower;

      // Расчет 3D-наклона от точки касания
      const rect = coin.getBoundingClientRect();
      const touchX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const touchY = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      const tiltX = ((touchY - rect.height / 2) / (rect.height / 2)) * -18;
      const tiltY = ((touchX - rect.width / 2) / (rect.width / 2)) * 18;

      coin.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(0.96)`;
      setTimeout(() => {
        coin.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      }, 100);

      // Создание вылетающей частицы (+число и фотка)
      createParticle(touchX, touchY);

      updateUI();
      saveState();
    }

    function createParticle(x, y) {
      const particle = document.createElement('div');
      particle.className = 'pop-particle';
      particle.style.setProperty('--rx', Math.random());
      particle.style.left = `${x + 10}px`;
      particle.style.top = `${y - 10}px`;

      particle.innerHTML = `<span>+${tapPower}</span>`;
      coinWrapper.appendChild(particle);

      setTimeout(() => particle.remove(), 750);
    }

    coin.addEventListener('pointerdown', handleTap);

    // Покупка Мультитапа
    function buyMultitap() {
      if (score >= costTap) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        score -= costTap;
        tapPower += 1;
        costTap = Math.round(costTap * 1.8);
        updateUI();
        saveState();
      }
    }

    // Покупка лимита энергии
    function buyEnergyLimit() {
      if (score >= costEnergy) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        score -= costEnergy;
        maxEnergy += 500;
        energy += 500;
        costEnergy = Math.round(costEnergy * 1.7);
        updateUI();
        saveState();
      }
    }

    // Покупка автобота
    function buyAutoBot() {
      if (score >= costAuto) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        score -= costAuto;
        autoPower += 1;
        costAuto = Math.round(costAuto * 2.0);
        updateUI();
        saveState();
      }
    }

    // Пассивный доход каждую секунду
    setInterval(() => {
      if (autoPower > 0) {
        score += autoPower;
        updateUI();
        saveState();
      }
    }, 1000);

    // Восстановление энергии (+3 каждые 0.5с)
    setInterval(() => {
      if (energy < maxEnergy) {
        energy = Math.min(maxEnergy, energy + 4);
        updateUI();
      }
    }, 500);

    updateUI();
  </script>
</body>
</html>
