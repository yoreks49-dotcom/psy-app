<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>GlistCoin Boss Clicker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at center top, #2d1810, #09090b);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 14px 12px;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Шапка баланса и звука */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 360px;
      padding: 4px 8px;
    }
    .score-badge {
      font-size: 20px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dps-badge {
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      background: rgba(52, 211, 153, 0.15);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .sound-toggle-btn {
      background: rgba(39, 39, 42, 0.85);
      border: 1px solid #3f3f46;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    /* Босс-арена */
    .boss-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      margin: 2px 0;
      position: relative;
    }
    .boss-name {
      font-size: 15px;
      font-weight: 800;
      color: #fca5a5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    /* Полоска здоровья HP */
    .hp-container {
      width: 100%;
      height: 16px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
      border: 1.5px solid #7f1d1d;
      position: relative;
      margin-bottom: 8px;
    }
    .hp-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ef4444, #f87171);
      border-radius: 999px;
      transition: width 0.1s ease;
    }
    .hp-text {
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      line-height: 14px;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    /* Круглый босс */
    .boss-wrapper {
      position: relative;
      perspective: 1000px;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .boss-avatar {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 4px solid #fbbf24;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.4), inset 0 0 15px rgba(0,0,0,0.6);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.08s ease;
      touch-action: manipulation;
    }
    .boss-avatar.shake {
      animation: hitShake 0.12s ease-in-out;
    }
    @keyframes hitShake {
      0% { transform: scale(0.95) translate(2px, 1px); }
      50% { transform: scale(0.92) translate(-2px, -1px); }
      100% { transform: scale(1) translate(0, 0); }
    }

    /* Вылетающий урон */
    .dmg-text {
      position: absolute;
      font-size: 22px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
      pointer-events: none;
      animation: popUp 0.65s ease-out forwards;
      z-index: 100;
    }
    .dmg-text.crit {
      font-size: 30px;
      color: #ef4444;
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
    }
    @keyframes popUp {
      0% { opacity: 1; transform: translateY(0) scale(0.9); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
    }

    /* Магазин артефактов */
    .shop-section {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 195px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .item-card {
      background: rgba(39, 39, 42, 0.85);
      border: 1px solid #3f3f46;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .item-card.locked {
      opacity: 0.45;
      background: rgba(24, 24, 27, 0.6);
      border-style: dashed;
    }
    .item-card.bought {
      border-color: #059669;
      background: rgba(5, 150, 105, 0.15);
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-icon { font-size: 22px; }
    .item-info-name { font-size: 13px; font-weight: 700; color: #f4f4f5; }
    .item-info-desc { font-size: 10px; color: #a1a1aa; }
    .buy-btn {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      color: #18181b;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .buy-btn.disabled {
      background: #3f3f46;
      color: #71717a;
      cursor: not-allowed;
    }

    /* Кнопка сохранения */
    .save-action-btn {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      color: #18181b;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
      margin-top: 4px;
    }
    .save-action-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <div class="top-bar">
    <div class="score-badge">🪙 <span id="score">0</span></div>
    <div class="top-controls">
      <div class="dps-badge" id="dpsText">+0/с</div>
      <button type="button" class="sound-toggle-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    </div>
  </div>

  <!-- Арена с Боссом -->
  <div class="boss-arena">
    <div class="boss-name" id="bossName">Уровень 1: Цыпленок-Новичок</div>
    
    <div class="hp-container">
      <div class="hp-bar" id="hpBar"></div>
      <div class="hp-text" id="hpText">1 500 / 1 500 HP</div>
    </div>

    <div class="boss-wrapper" id="bossWrapper">
      <div class="boss-avatar" id="bossAvatar"></div>
    </div>
  </div>

  <!-- Магазин предметов -->
  <div class="shop-section" id="shopList"></div>

  <!-- Кнопка синхронизации -->
  <button type="button" class="save-action-btn" onclick="saveAndExit()">🏆 СОХРАНИТЬ В ТОП</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ================= ЗВУКОВОЙ ДВИЖОК (Web Audio API) =================
    let audioCtx = null;
    let isSoundOn = localStorage.getItem('gb_sound') !== 'false';

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      localStorage.setItem('gb_sound', isSoundOn);
      document.getElementById('soundBtn').innerText = isSoundOn ? '🔊' : '🔇';
    }

    // Звук обычного тапа (сочный клик-поп)
    function playTapSound() {
      if (!isSoundOn) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(450, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.06);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }

    // Звук критического удара (звонкий металлический акцент)
    function playCritSound() {
      if (!isSoundOn) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);

      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // ================= КОНФИГУРАЦИЯ БОССОВ =================
    const BOSSES = [
      {
        name: "Уровень 1: Цыпленок-Новичок",
        hp: 1500,
        reward: 500,
        img: "https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg?auto=compress&cs=tinysrgb&w=300"
      },
      {
        name: "Уровень 2: Злой Полковник",
        hp: 6000,
        reward: 2500,
        img: "https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg?auto=compress&cs=tinysrgb&w=300"
      },
      {
        name: "Уровень 3: Кибер-Яйцо Овипрайм",
        hp: 25000,
        reward: 10000,
        img: "https://images.pexels.com/photos/1624496/pexels-photo-1624496.jpeg?auto=compress&cs=tinysrgb&w=300"
      },
      {
        name: "ФИНАЛ: Властелин Шумовки 👑",
        hp: 100000,
        reward: 50000,
        img: "GlistCoin.png"
      }
    ];

    const ITEMS = [
      { id: 0, name: "Деревянная ложка", icon: "🥄", cost: 50, tap: 2, auto: 0, desc: "+2 к клику" },
      { id: 1, name: "Стальная шумовка", icon: "🍳", cost: 350, tap: 8, auto: 3, desc: "+8 к клику, +3/сек" },
      { id: 2, name: "Электро-венчик", icon: "⚡", cost: 1800, tap: 30, auto: 15, desc: "+30 к клику, +15/сек" },
      { id: 3, name: "Броня из фольги", icon: "🛡️", cost: 7500, tap: 100, auto: 50, desc: "+100 к клику, +50/сек" },
      { id: 4, name: "Золотой капюшон", icon: "👑", cost: 30000, tap: 400, auto: 200, desc: "+400 к клику, +200/сек" }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const serverScore = parseInt(urlParams.get('score')) || 0;
    const serverTap = parseInt(urlParams.get('tap')) || 1;
    const serverAuto = parseInt(urlParams.get('auto')) || 0;

    let score = Math.max(serverScore, parseInt(localStorage.getItem('gb_score')) || 0);
    let tapPower = Math.max(serverTap, parseInt(localStorage.getItem('gb_tap')) || 1);
    let autoPower = Math.max(serverAuto, parseInt(localStorage.getItem('gb_auto')) || 0);

    let currentBossIdx = parseInt(localStorage.getItem('gb_boss_idx')) || 0;
    let currentHp = parseInt(localStorage.getItem('gb_boss_hp')) || BOSSES[currentBossIdx].hp;
    let unlockedItemId = parseInt(localStorage.getItem('gb_unlocked_item')) || 0;

    const scoreEl = document.getElementById('score');
    const dpsText = document.getElementById('dpsText');
    const bossNameEl = document.getElementById('bossName');
    const hpBar = document.getElementById('hpBar');
    const hpText = document.getElementById('hpText');
    const bossAvatar = document.getElementById('bossAvatar');
    const bossWrapper = document.getElementById('bossWrapper');
    const shopList = document.getElementById('shopList');

    function saveLocal() {
      localStorage.setItem('gb_score', score);
      localStorage.setItem('gb_tap', tapPower);
      localStorage.setItem('gb_auto', autoPower);
      localStorage.setItem('gb_boss_idx', currentBossIdx);
      localStorage.setItem('gb_boss_hp', currentHp);
      localStorage.setItem('gb_unlocked_item', unlockedItemId);
    }

    function updateBossUI() {
      const boss = BOSSES[currentBossIdx];
      bossNameEl.innerText = boss.name;
      bossAvatar.style.backgroundImage = `url('${boss.img}')`;
      
      const pct = Math.max(0, (currentHp / boss.hp) * 100);
      hpBar.style.width = `${pct}%`;
      hpText.innerText = `${Math.round(currentHp).toLocaleString()} / ${boss.hp.toLocaleString()} HP`;
    }

    function renderShop() {
      shopList.innerHTML = '';
      ITEMS.forEach((item, idx) => {
        const isBought = idx < unlockedItemId;
        const isCurrent = idx === unlockedItemId;
        const isLocked = idx > unlockedItemId;

        const card = document.createElement('div');
        card.className = `item-card ${isBought ? 'bought' : ''} ${isLocked ? 'locked' : ''}`;

        if (isLocked) {
          card.innerHTML = `
            <div class="item-left">
              <span class="item-icon">❓</span>
              <div>
                <div class="item-info-name">Неизвестный артефакт</div>
                <div class="item-info-desc">Купите предыдущий предмет</div>
              </div>
            </div>
            <button class="buy-btn disabled">???</button>
          `;
        } else if (isBought) {
          card.innerHTML = `
            <div class="item-left">
              <span class="item-icon">${item.icon}</span>
              <div>
                <div class="item-info-name">${item.name}</div>
                <div class="item-info-desc">Активно (${item.desc})</div>
              </div>
            </div>
            <button class="buy-btn" style="background:#059669;color:#fff;">Куплено ✔</button>
          `;
        } else {
          card.innerHTML = `
            <div class="item-left">
              <span class="item-icon">${item.icon}</span>
              <div>
                <div class="item-info-name">${item.name}</div>
                <div class="item-info-desc">${item.desc}</div>
              </div>
            </div>
            <button class="buy-btn ${score < item.cost ? 'disabled' : ''}" onclick="buyItem(${idx})">
              ${item.cost.toLocaleString()} 🪙
            </button>
          `;
        }
        shopList.appendChild(card);
      });
    }

    function updateUI() {
      scoreEl.innerText = score.toLocaleString('ru-RU');
      dpsText.innerText = `+${autoPower}/с (Тап: ${tapPower})`;
      updateBossUI();
      renderShop();
    }

    function handleTap(e) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      const isCrit = Math.random() < 0.08;
      const damage = isCrit ? tapPower * 5 : tapPower;

      // Воспроизводим звук клика
      if (isCrit) {
        playCritSound();
      } else {
        playTapSound();
      }

      score += damage;
      currentHp = Math.max(0, currentHp - damage);

      bossAvatar.classList.remove('shake');
      void bossAvatar.offsetWidth;
      bossAvatar.classList.add('shake');

      showDamage(damage, isCrit, e);

      if (currentHp <= 0) {
        onBossDefeated();
      }

      updateUI();
      saveLocal();
    }

    function showDamage(dmg, isCrit, e) {
      const rect = bossWrapper.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX) || rect.left + 80;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY) || rect.top + 60;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      const tag = document.createElement('div');
      tag.className = `dmg-text ${isCrit ? 'crit' : ''}`;
      tag.innerText = isCrit ? `CRIT! +${dmg}` : `+${dmg}`;
      tag.style.left = `${x}px`;
      tag.style.top = `${y}px`;

      bossWrapper.appendChild(tag);
      setTimeout(() => tag.remove(), 650);
    }

    function onBossDefeated() {
      const reward = BOSSES[currentBossIdx].reward;
      score += reward;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      if (currentBossIdx < BOSSES.length - 1) {
        currentBossIdx++;
      }
      currentHp = BOSSES[currentBossIdx].hp;
    }

    function buyItem(idx) {
      const item = ITEMS[idx];
      if (score >= item.cost && idx === unlockedItemId) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        score -= item.cost;
        tapPower += item.tap;
        autoPower += item.auto;
        unlockedItemId++;
        updateUI();
        saveLocal();
      }
    }

    bossAvatar.addEventListener('pointerdown', handleTap);

    setInterval(() => {
      if (autoPower > 0) {
        score += autoPower;
        currentHp = Math.max(0, currentHp - autoPower);
        if (currentHp <= 0) onBossDefeated();
        updateUI();
        saveLocal();
      }
    }, 1000);

    function saveAndExit() {
      saveLocal();
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "sync",
          score: score,
          tap_power: tapPower,
          auto_power: autoPower
        }));
        tg.close();
      }
    }

    document.getElementById('soundBtn').innerText = isSoundOn ? '🔊' : '🔇';
    updateUI();
  </script>
</body>
</html>
